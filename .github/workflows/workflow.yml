name: Java-SDK GitHub Actions
on:
  push:
    branches:
      - master
      - 'release-*'
  pull_request:
  release:
    types: [ published, created, edited ]
env:
  CCACHE_DIR: ${{ github.workspace }}/ccache
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    name: build
    # Windows build (compile + unit tests, no integration). Heavy integration
    # tests run in the separate 'integration' job below. Both run on PRs and
    # releases only; pushes to the main branches run just the lightweight
    # 'coverage' job (to upload a Codecov BASE report so PRs show a coverage delta).
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-2025 ]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 5
      - uses: actions/cache@v3
        id: deps_cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: build-${{ matrix.os }}-${{ github.base_ref }}-${{ hashFiles('.github/workflows/workflow.yml') }}
          restore-keys: |
            build-${{ matrix.os }}-${{ github.base_ref }}-${{ hashFiles('.github/workflows/workflow.yml') }}
            build-${{ matrix.os }}-${{ github.base_ref }}-
            build-${{ matrix.os }}-
      - name: Set up JDK 1.8.0.382
        uses: actions/setup-java@v3
        with:
            distribution: 'zulu'
            java-version: '8.0.382'
      - name: run build test
        run: ./gradlew.bat build

  integration:
    name: integration
    # One integration round per job so the three chains run as independent
    # parallel jobs (each builds a single 4-node chain) instead of one runner
    # carrying all three chains through three sequential rounds. Same tests,
    # same serial per-round execution — only the rounds are parallelized.
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        round: [ pinned-ecdsa, latest-ecdsa, latest-sm ]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 5
      - uses: actions/cache@v3
        id: deps_cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
            ~/.ccache
            ~/.fisco
          key: integration-${{ matrix.os }}-${{ github.base_ref }}-${{ hashFiles('.github/workflows/workflow.yml') }}
          restore-keys: |
            integration-${{ matrix.os }}-${{ github.base_ref }}-${{ hashFiles('.github/workflows/workflow.yml') }}
            integration-${{ matrix.os }}-${{ github.base_ref }}-
            integration-${{ matrix.os }}-
      - name: install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update && sudo apt install -y git curl libssl-dev build-essential ccache
      - name: install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 ccache
      - name: Set up JDK 1.8.0.382
        uses: actions/setup-java@v3
        with:
            distribution: 'zulu'
            java-version: '8.0.382'
      - name: run integration testing
        run: /bin/bash .ci/ci_check.sh ${{ matrix.round }}

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 5
      - uses: actions/cache@v3
        id: deps_cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: coverage-${{ github.base_ref }}-${{ hashFiles('.github/workflows/workflow.yml') }}
          restore-keys: |
            coverage-${{ github.base_ref }}-
            coverage-
      - name: install Ubuntu dependencies
        run: |
          sudo apt update && sudo apt install -y git curl libssl-dev build-essential
      - name: Set up JDK 1.8.0.382
        uses: actions/setup-java@v3
        with:
            distribution: 'zulu'
            java-version: '8.0.382'
      - name: run unit tests with coverage
        run: /bin/bash gradlew test jacocoTestReport
      - name: upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/jacoco/test/jacocoTestReport.xml
          flags: unittest
          fail_ci_if_error: false
          verbose: true
