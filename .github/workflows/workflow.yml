name: Java-SDK GitHub Actions
on:
  push:
    branches:
      - master
      - 'release-*'
  pull_request:
  release:
    types: [ published, created, edited ]
env:
  CCACHE_DIR: ${{ github.workspace }}/ccache
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    name: build
    # Heavy integration build runs on PRs and releases only; pushes to the main
    # branches run just the lightweight 'coverage' job below (to upload a Codecov
    # BASE report so PRs can show a coverage delta).
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, windows-2025, macos-latest ]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 5
      - uses: actions/cache@v3
        id: deps_cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
            ~/.ccache
            ~/.fisco
          key: build-${{ matrix.os }}-${{ github.base_ref }}-${{ hashFiles('.github/workflows/workflow.yml') }}
          restore-keys: |
            build-${{ matrix.os }}-${{ github.base_ref }}-${{ hashFiles('.github/workflows/workflow.yml') }}
            build-${{ matrix.os }}-${{ github.base_ref }}-
            build-${{ matrix.os }}-
      - name: install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update && sudo apt install -y git curl libssl-dev build-essential ccache
      - name: install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install openssl@1.1 ccache
      - name: Set up JDK 1.8.0.382
        uses: actions/setup-java@v3
        with:
            distribution: 'zulu'
            java-version: '8.0.382'
      - name: run build test
        if: runner.os == 'Windows'
        run: ./gradlew.bat build
      - name: run integration testing
        if: runner.os != 'Windows'
        run: /bin/bash .ci/ci_check.sh

  coverage:
    name: coverage
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 5
      - uses: actions/cache@v3
        id: deps_cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: coverage-${{ github.base_ref }}-${{ hashFiles('.github/workflows/workflow.yml') }}
          restore-keys: |
            coverage-${{ github.base_ref }}-
            coverage-
      - name: install Ubuntu dependencies
        run: |
          sudo apt update && sudo apt install -y git curl libssl-dev build-essential
      - name: Set up JDK 1.8.0.382
        uses: actions/setup-java@v3
        with:
            distribution: 'zulu'
            java-version: '8.0.382'
      - name: run unit tests with coverage
        run: /bin/bash gradlew test jacocoTestReport
      - name: upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/jacoco/test/jacocoTestReport.xml
          flags: unittest
          fail_ci_if_error: false
          verbose: true
